name: clinicflow

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: clinicflow-postgres
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
    name: clinicflow-postgres-data
