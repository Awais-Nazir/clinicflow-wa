[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinicflow-wa"
version = "0.1.0"
description = "A multi-tenant WhatsApp assistant for clinics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinicflow"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
